<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ページの文字コードや表示領域など、文書全体の基本設定です。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車を運転しよう</title>
<!-- 3D表示を作るThree.jsライブラリを読み込みます。 -->
<script src="three.js"></script>
<!-- 画面全体と操作パネルの見た目・配置を指定します。 -->
<style>
  /* 余白をなくし、3D画面をウィンドウいっぱいに表示します。 */
  body { margin: 0; overflow: hidden; background: #b9d9ef; }
  /* キーボード操作の説明を左上に固定表示します。 */
  #help { position: fixed; top: 12px; left: 12px; padding: 10px 14px; color: #fff; background: #17212dcc; border-radius: 8px; font: 16px sans-serif; }
  /* カメラ切り替えボタンの基本デザインです（現行HTMLでは未使用）。 */
  #cameraButton { position: fixed; top: 12px; right: 12px; padding: 11px 16px; border: 0; border-radius: 8px; color: white; background: #17212dcc; font: 16px sans-serif; cursor: pointer; }
  /* カメラボタンにマウスを載せたときの色です。 */
  #cameraButton:hover { background: #17212d; }
  /* 速度・視点・交通量の設定パネルを右上に配置します。 */
  #controls { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; color: #fff; background: #17212dcc; border-radius: 8px; font: 15px sans-serif; }
  /* パネル内の各設定を横並びにそろえます。 */
  .controlRow { display: flex; align-items: center; gap: 8px; }
  /* 操作パネル内のボタンの見た目を統一します。 */
  #controls button { border: 0; border-radius: 6px; padding: 7px 10px; color: #fff; background: #394957; font: inherit; cursor: pointer; }
  /* スライダーの横幅を設定します。 */
  #controls input { width: 130px; }
  #controls button.active { background: #d18a16; }
</style>
</head>
<body>
<!-- キー操作の簡単な案内です。 -->
<div id="help">↑ 前進　↓ 減速・後退　Q ブレーキ　← → ハンドル</div>
<!-- 速度倍率、カメラ視点、横切る車の出現間隔を調整するUIです。 -->
<div id="controls">
  <div class="controlRow">
    <label for="speedControl">速度</label>
    <input id="speedControl" type="range" min="0.5" max="3" step="0.5" value="2">
    <span id="speedValue">2.0倍</span>
  </div>
  <div class="controlRow">
    <span>視点</span>
    <button id="cameraMode" type="button">一人称視点</button>
    <button id="cameraLeft" type="button">← 左</button>
    <button id="cameraRight" type="button">右 →</button>
  </div>
  <div class="controlRow">
    <span>ライト</span><button id="headlightButton" type="button" aria-pressed="false">前照灯 OFF</button><button id="leftSignalButton" type="button" aria-pressed="false">← 左ウィンカー</button><button id="rightSignalButton" type="button" aria-pressed="false">右ウィンカー →</button>
  </div>
  <div class="controlRow">
    <span>他の車</span>
    <button id="spawnTrafficButton" type="button">車を発生</button>
  </div>
</div>
<script>
// 3Dオブジェクトを配置する舞台です。
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d9ef);
scene.fog = new THREE.Fog(0xb9d9ef, 12000, 50000);
// プレイヤーが見る視点。画角や描画距離もここで決めます。
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 1, 100000);
// WebGLで3Dを画面に描く装置を用意します。
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 空と地面からの環境光、および影を作る太陽光を追加します。
scene.add(new THREE.HemisphereLight(0xffffff, 0x64745a, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-3000, 6000, 4000);
sun.castShadow = true;
scene.add(sun);

// 道路の周囲に広がる地面です。
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100000, 100000), new THREE.MeshStandardMaterial({ color: 0x668b4e, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -300;
ground.receiveShadow = true;
scene.add(ground);

// 直線道路：前後に長く続く一本道です。
const asphalt = new THREE.MeshStandardMaterial({ color: 0x34383d, roughness: 0.95 });
const roadAlongZ = new THREE.Mesh(new THREE.BoxGeometry(3600, 26, 50000), asphalt);
roadAlongZ.position.y = -284;
roadAlongZ.receiveShadow = true;
scene.add(roadAlongZ);
const paint = new THREE.MeshStandardMaterial({ color: 0xf4f0d8, roughness: 0.8 });
// 道路の線や横断歩道を簡単に作る共通関数です。
function roadMark(w, h, d, x, y, z, material = paint) {
  const mark = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mark.position.set(x, y, z);
  scene.add(mark);
}
// 直線道路の中央に破線を引きます。交差点の標示はありません。
for (let z = -24000; z <= 24000; z += 1800) roadMark(35, 8, 900, 0, -266, z);

// 操作する車
// プレイヤーが操作する車を複数の部品で組み立てる親グループです。
const car = new THREE.Group();
scene.add(car);
car.position.set(-700, 0, 22000);
// Nマークが車の前に来るよう、車体とマークを一緒に180度回転します。
car.rotation.y = Math.PI;
// 操作車は直線道路の端からスタートし、前方に他の車が出現します。
// 車体、屋根、タイヤを作成し、親グループにまとめます。
const body = new THREE.Mesh(new THREE.BoxGeometry(900, 400, 2000), new THREE.MeshStandardMaterial({ color: 0xe74732, roughness: 0.55 }));
body.position.y = -20;
body.castShadow = true;
body.receiveShadow = true;
car.add(body);
// 前照灯と後部ランプを車体に取り付けます。前照灯はボタンで照射します。
const headlightBulbs = [];
const headlightSpots = [];
for (const x of [-300, 300]) {
  const bulb = new THREE.Mesh(new THREE.BoxGeometry(180, 100, 28), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0x000000 }));
  bulb.position.set(x, 75, 1008);
  car.add(bulb);
  headlightBulbs.push(bulb);
  const target = new THREE.Object3D();
  target.position.set(x, 40, 6500);
  car.add(target);
  const spot = new THREE.SpotLight(0xfff1c2, 0, 9000, Math.PI / 7, 0.35, 1.2);
  spot.position.set(x, 65, 990);
  spot.target = target;
  car.add(spot);
  headlightSpots.push(spot);
}
const rearLamps = [];
for (const x of [-300, 300]) {
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(180, 110, 30), new THREE.MeshStandardMaterial({ color: 0x4d0808, emissive: 0x000000 }));
  lamp.position.set(x, 75, -1008);
  car.add(lamp);
  rearLamps.push(lamp);
}
const signalLamps = { left: [], right: [] };
for (const x of [-390, 390]) {
  const side = x < 0 ? 'right' : 'left';
  for (const z of [-1005, 1005]) {
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(95, 90, 32), new THREE.MeshStandardMaterial({ color: 0x5a3200, emissive: 0x000000 }));
    lamp.position.set(x, 95, z);
    car.add(lamp);
    signalLamps[side].push(lamp);
  }
}

const roof = new THREE.Mesh(new THREE.BoxGeometry(760, 330, 1050), new THREE.MeshStandardMaterial({ color: 0xbfe4ed, roughness: 0.3, metalness: 0.15 }));
roof.position.set(0, 345, -120);
roof.castShadow = true;
car.add(roof);
// タイヤのグループを保存し、走行時に回転させます。
const wheels = [];
const tireMaterial = new THREE.MeshStandardMaterial({ color: 0x202124, roughness: 0.9 });
const hubMaterial = new THREE.MeshStandardMaterial({ color: 0xc8cbd0, metalness: 0.65, roughness: 0.3 });
for (const x of [-520, 520]) {
  for (const z of [-620, 650]) {
    const wheel = new THREE.Group();
    wheel.position.set(x, -130, z);
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(180, 180, 130, 32), tireMaterial);
        tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wheel.add(tire);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(92, 92, 136, 24), hubMaterial);
    hub.rotation.z = Math.PI / 2;
    wheel.add(hub);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// 車の前後左右が分かるよう、車体の周囲に方角マークを表示します。
// 車の周囲に方角を示すラベルを描画して取り付けます。
function addDirectionMark(label, x, z) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const context = canvas.getContext('2d');
  context.fillStyle = 'rgba(255,255,255,0.94)';
  context.beginPath();
  context.arc(128, 128, 112, 0, Math.PI * 2);
  context.fill();
  context.strokeStyle = '#17212d';
  context.lineWidth = 12;
  context.stroke();
  context.fillStyle = '#17212d';
  context.font = 'bold 150px sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(label, 128, 133);
  const texture = new THREE.CanvasTexture(canvas);
  const mark = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false }));
  mark.position.set(x, 780, z);
  mark.scale.set(360, 360, 1);
  car.add(mark);
}
addDirectionMark('N', 0, 1450);
addDirectionMark('E', -850, 0);
addDirectionMark('W', 850, 0);
addDirectionMark('S', 0, -1450);

// ボタンを押すと道路端に現れ、道路を端から端まで走る車です。
// 道路端から端まで走る車と、出現タイマー・衝突エフェクトを管理します。
const traffic = [];
const explosions = [];
// 対向交通の車をランダムな色で作り、道路上に出現させます。
function makeTrafficCar() {
  const vehicle = new THREE.Group();
  const color = [0x2878c7, 0xf4c542, 0xeeeeee, 0x38a06c][Math.floor(Math.random() * 4)];
  const shell = new THREE.Mesh(new THREE.BoxGeometry(900, 400, 2000), new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
  shell.position.y = -20;
  shell.castShadow = true;
  vehicle.add(shell);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(760, 330, 1050), new THREE.MeshStandardMaterial({ color: 0xa9d6e5, roughness: 0.3 }));
  cabin.position.set(0, 345, -120);
  vehicle.add(cabin);
  for (const x of [-520, 520]) {
    for (const z of [-620, 650]) {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(180, 180, 130, 32), tireMaterial);
          tire.rotation.z = Math.PI / 2;
      tire.position.set(x, -130, z);
      vehicle.add(tire);
    }
  }
  // +X方向へ進む車は、進行方向に対して左側（道路の-Z側）を走ります。
  vehicle.position.set(car.position.x < 0 ? -900 : 900, 0, 16000);
  vehicle.rotation.y = Math.PI;
  // 交通車にも前照灯と赤い後部灯を付けます。車はローカル+Z方向へ進みます。
  for (const x of [-300, 300]) {
    const headlamp = new THREE.Mesh(new THREE.BoxGeometry(180, 100, 28), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0xffd966, emissiveIntensity: 1.4 }));
    headlamp.position.set(x, 75, 1008);
    vehicle.add(headlamp);
    const tailLamp = new THREE.Mesh(new THREE.BoxGeometry(180, 110, 30), new THREE.MeshStandardMaterial({ color: 0xd91616, emissive: 0x7a0000, emissiveIntensity: 0.8 }));
    tailLamp.position.set(x, 75, -1008);
    vehicle.add(tailLamp);
    const target = new THREE.Object3D();
    target.position.set(x, 35, 6500);
    vehicle.add(target);
    const headlight = new THREE.SpotLight(0xfff0c2, 5, 8000, Math.PI / 7, 0.4, 1.2);
    headlight.position.set(x, 60, 990);
    headlight.target = target;
    vehicle.add(headlight);
  }
  scene.add(vehicle);
  traffic.push(vehicle);
}
document.getElementById('spawnTrafficButton').addEventListener('click', makeTrafficCar);

// 衝突位置に粒子を発生させる爆発表現を作ります。
function explodeAt(position) {
  const particles = [];
  const colors = [0xff3b16, 0xffa321, 0xffe56b, 0x555555];
  for (let i = 0; i < 32; i++) {
    const particle = new THREE.Mesh(
      new THREE.SphereGeometry(45 + Math.random() * 55, 8, 8),
      new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)], transparent: true })
    );
    particle.position.copy(position);
    scene.add(particle);
    particles.push({ mesh: particle, velocity: new THREE.Vector3((Math.random() - 0.5) * 2200, Math.random() * 1800, (Math.random() - 0.5) * 2200) });
  }
  explosions.push({ particles, age: 0 });
}

// 押されているキーを記録し、押下・解放・ウィンドウ離脱を追跡します。
const keys = Object.create(null);
window.addEventListener('keydown', (event) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) event.preventDefault();
  keys[event.key] = true;
  keys[event.code] = true;
});
window.addEventListener('keyup', (event) => { keys[event.key] = false; keys[event.code] = false; });
window.addEventListener('blur', () => { for (const key in keys) keys[key] = false; });

// 車速・車の進行向き・カメラ向き・一人称視点の状態を保持します。
let speed = 0;
let movementYaw = car.rotation.y;
let cameraYaw = 0;
let firstPersonView = false;
// UI部品を取得し、スライダーやボタンの操作をゲーム状態へ反映します。
const speedControl = document.getElementById('speedControl');
const speedValue = document.getElementById('speedValue');
speedControl.addEventListener('input', () => { speedValue.textContent = `${Number(speedControl.value).toFixed(1)}倍`; });
document.getElementById('cameraLeft').addEventListener('click', () => { cameraYaw += Math.PI / 2; });
document.getElementById('cameraRight').addEventListener('click', () => { cameraYaw -= Math.PI / 2; });
document.getElementById('cameraMode').addEventListener('click', (event) => {
  firstPersonView = !firstPersonView;
  event.currentTarget.textContent = firstPersonView ? '三人称視点' : '一人称視点';
});
// フレーム間の経過時間を測り、動きを画面更新頻度に左右されにくくします。
let headlightsOn = false;
let activeSignal = null;
let signalElapsed = 0;
const headlightButton = document.getElementById('headlightButton');
const leftSignalButton = document.getElementById('leftSignalButton');
const rightSignalButton = document.getElementById('rightSignalButton');
function setSignal(side) {
  activeSignal = activeSignal === side ? null : side;
  for (const [name, button] of [['left', leftSignalButton], ['right', rightSignalButton]]) {
    const isActive = activeSignal === name;
    button.classList.toggle('active', isActive);
    button.setAttribute('aria-pressed', String(isActive));
  }
}
headlightButton.addEventListener('click', () => {
  headlightsOn = !headlightsOn;
  headlightButton.textContent = headlightsOn ? '前照灯 ON' : '前照灯 OFF';
  headlightButton.classList.toggle('active', headlightsOn);
  headlightButton.setAttribute('aria-pressed', String(headlightsOn));
  for (const bulb of headlightBulbs) bulb.material.emissive.setHex(headlightsOn ? 0xffe48a : 0x000000);
  for (const spot of headlightSpots) spot.intensity = headlightsOn ? 8 : 0;
});
leftSignalButton.addEventListener('click', () => setSignal('left'));
rightSignalButton.addEventListener('click', () => setSignal('right'));

const clock = new THREE.Clock();
// 2台の車の向きを考慮し、矩形の車体が接触しているか判定します。
function carsOverlap(a, b) {
  // 車体の長方形同士を、各車の向きに沿った軸で判定します。
  const halfWidth = 450;
  const halfLength = 1000;
  const axes = [];
  for (const vehicle of [a, b]) {
    const yaw = vehicle.rotation.y;
    axes.push({ x: Math.cos(yaw), z: -Math.sin(yaw) });
    axes.push({ x: Math.sin(yaw), z: Math.cos(yaw) });
  }
  const dx = b.position.x - a.position.x;
  const dz = b.position.z - a.position.z;
  for (const axis of axes) {
    const distance = Math.abs(dx * axis.x + dz * axis.z);
    const radiusA = Math.abs((Math.cos(a.rotation.y) * axis.x - Math.sin(a.rotation.y) * axis.z)) * halfWidth
      + Math.abs((Math.sin(a.rotation.y) * axis.x + Math.cos(a.rotation.y) * axis.z)) * halfLength;
    const radiusB = Math.abs((Math.cos(b.rotation.y) * axis.x - Math.sin(b.rotation.y) * axis.z)) * halfWidth
      + Math.abs((Math.sin(b.rotation.y) * axis.x + Math.cos(b.rotation.y) * axis.z)) * halfLength;
    if (distance > radiusA + radiusB) return false;
  }
  return true;
}
// 毎フレーム呼び出され、交通・衝突・操作・カメラを更新して描画します。
function draw() {
  requestAnimationFrame(draw);
    const dt = Math.min(clock.getDelta(), 0.05);
    for (let i = traffic.length - 1; i >= 0; i--) {
    const vehicle = traffic[i];
    // 操作車の左右車線に合わせて、対向車も滑らかに車線を移ります。
    const targetLaneX = car.position.x < 0 ? -900 : 900;
    vehicle.position.x += (targetLaneX - vehicle.position.x) * Math.min(1, dt * 3);
    vehicle.position.z -= 1500 * dt;
    if (carsOverlap(car, vehicle)) {
      explodeAt(new THREE.Vector3((vehicle.position.x + car.position.x) / 2, 180, (vehicle.position.z + car.position.z) / 2));
      scene.remove(vehicle);
      traffic.splice(i, 1);
      speed *= 0.25;
    } else if (vehicle.position.z < -26000) { scene.remove(vehicle); traffic.splice(i, 1); }
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    const effect = explosions[i];
    effect.age += dt;
    for (const particle of effect.particles) {
      particle.mesh.position.addScaledVector(particle.velocity, dt);
      particle.velocity.y -= 900 * dt;
      particle.mesh.material.opacity = Math.max(0, 1 - effect.age / 1.1);
    }
    if (effect.age >= 1.1) {
      for (const particle of effect.particles) { scene.remove(particle.mesh); particle.mesh.geometry.dispose(); particle.mesh.material.dispose(); }
      explosions.splice(i, 1);
    }
  }

  // Qキーを押している間は前後進を問わず、↓キーで前進を減速する間もブレーキランプを点灯します。
  const braking = keys.KeyQ || (keys.ArrowDown && speed > 0);
  for (const lamp of rearLamps) {
    lamp.material.emissive.setHex(braking ? 0xff0000 : 0x000000);
    lamp.material.color.setHex(braking ? 0xff2525 : 0x4d0808);
  }
  signalElapsed += dt;
  const signalLit = activeSignal !== null && Math.floor(signalElapsed / 0.45) % 2 === 0;
  for (const [side, lamps] of Object.entries(signalLamps)) {
    for (const lamp of lamps) {
      const on = side === activeSignal && signalLit;
      lamp.material.emissive.setHex(on ? 0xff9d00 : 0x000000);
      lamp.material.color.setHex(on ? 0xffb21c : 0x5a3200);
    }
  }
  // ↑キーでNマーク方向へ前進し、↓キーで減速して停止後は後退します。
  const speedMultiplier = Number(speedControl.value);
  const maxSpeed = 2600 * speedMultiplier;
  if (keys.ArrowUp && !keys.KeyQ) speed = Math.min(speed + 900 * speedMultiplier * dt, maxSpeed);
  else if (keys.KeyQ) speed = Math.abs(speed) < 1100 * speedMultiplier * dt ? 0 : speed - Math.sign(speed) * 1100 * speedMultiplier * dt;
  else if (keys.ArrowDown) speed = Math.max(speed - 1100 * speedMultiplier * dt, -1000 * speedMultiplier);
  else speed *= Math.pow(0.985, dt * 60);
  const steering = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  if (steering !== 0) {
    const turnAmount = steering * 0.9 * dt * (Math.abs(speed) > 5 ? Math.sign(speed) : 1);
    movementYaw += turnAmount;
    car.rotation.y += turnAmount;
  }
  if (Math.abs(speed) > 5) {


        car.position.x += Math.sin(movementYaw) * speed * dt;
    car.position.z += Math.cos(movementYaw) * speed * dt;
    for (const wheel of wheels) wheel.rotation.x += speed * dt / 180;
  }

  // カメラの向きは車のハンドル操作から独立。ボタンで90度ずつ切り替えます。
  if (firstPersonView) {
    const cameraPosition = car.localToWorld(new THREE.Vector3(0, 590, 430));
    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
    camera.position.copy(cameraPosition);
    camera.lookAt(cameraPosition.clone().addScaledVector(forward, 5000));
  } else {
    const cameraBehind = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
    const target = car.position.clone().add(new THREE.Vector3(0, 180, 0));
    const cameraPosition = car.position.clone().addScaledVector(cameraBehind, 3200);
    cameraPosition.y += 1900;
    camera.position.lerp(cameraPosition, 1 - Math.pow(0.001, dt));
    camera.lookAt(target);
  }
  renderer.render(scene, camera);
}
draw();

// ウィンドウサイズ変更時にカメラと描画領域の比率を更新します。
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

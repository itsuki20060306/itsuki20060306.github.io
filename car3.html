<!DOCTYPE html>
<html lang="ja">
<head>
<!-- ページの文字コードや表示領域など、文書全体の基本設定です。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車を運転しよう</title>
<!-- 3D表示を作るThree.jsライブラリを読み込みます。 -->
<script src="three.js"></script>
<!-- 画面全体と操作パネルの見た目・配置を指定します。 -->
<style>
  /* 余白をなくし、3D画面をウィンドウいっぱいに表示します。 */
  body { margin: 0; overflow: hidden; background: #b9d9ef; }
  /* キーボード操作の説明を左上に固定表示します。 */
  #help { position: fixed; top: 12px; left: 12px; padding: 10px 14px; color: #fff; background: #17212dcc; border-radius: 8px; font: 16px sans-serif; }
  /* カメラ切り替えボタンの基本デザインです（現行HTMLでは未使用）。 */
  #cameraButton { position: fixed; top: 12px; right: 12px; padding: 11px 16px; border: 0; border-radius: 8px; color: white; background: #17212dcc; font: 16px sans-serif; cursor: pointer; }
  /* カメラボタンにマウスを載せたときの色です。 */
  #cameraButton:hover { background: #17212d; }
  /* 速度・視点・交通量の設定パネルを右上に配置します。 */
  #controls { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; color: #fff; background: #17212dcc; border-radius: 8px; font: 15px sans-serif; }
  /* パネル内の各設定を横並びにそろえます。 */
  .controlRow { display: flex; align-items: center; gap: 8px; }
  /* 操作パネル内のボタンの見た目を統一します。 */
  #controls button { border: 0; border-radius: 6px; padding: 7px 10px; color: #fff; background: #394957; font: inherit; cursor: pointer; }
  /* スライダーの横幅を設定します。 */
  #controls input { width: 130px; }
  #controls button.active { background: #d18a16; }
</style>
</head>
<body>
<!-- キー操作の簡単な案内です。 -->
<div id="help">↑ 前進　↓ 減速・後退　Q ブレーキ　← → ハンドル</div>
<!-- 速度倍率、カメラ視点、横切る車の出現間隔を調整するUIです。 -->
<div id="controls">
  <div class="controlRow">
    <label for="speedControl">速度</label>
    <input id="speedControl" type="range" min="0.5" max="3" step="0.5" value="2">
    <span id="speedValue">2.0倍</span>
  </div>
  <div class="controlRow">
    <span>視点</span>
    <button id="cameraMode" type="button">一人称視点</button>
    <button id="cameraLeft" type="button">← 左</button>
    <button id="cameraRight" type="button">右 →</button>
  </div>
  <div class="controlRow">
    <span>ライト</span><button id="lowBeamButton" type="button" aria-pressed="false">ロービーム OFF</button><button id="highBeamButton" type="button" aria-pressed="false">ハイビーム OFF</button><button id="leftSignalButton" type="button" aria-pressed="false">← 左ウィンカー</button><button id="rightSignalButton" type="button" aria-pressed="false">右ウィンカー →</button>
  </div>
  <div class="controlRow">
    <span>時間帯</span><button id="timeOfDayButton" type="button" aria-pressed="false">夜にする</button>
  </div>
  <div class="controlRow">
    <label for="trafficType">種類</label><select id="trafficType"><option value="car">普通</option><option value="truck">トラック</option><option value="bicycle">自転車</option></select>
  </div>
  <div class="controlRow">
    <label for="trafficSize">大きさ</label><input id="trafficSize" type="range" min="0.6" max="1.6" step="0.1" value="1"><span id="trafficSizeValue">1.0倍</span>
  </div>
  <div class="controlRow">
    <label for="trafficSpeed">速度</label><input id="trafficSpeed" type="range" min="500" max="3000" step="100" value="1500"><span id="trafficSpeedValue">1500</span>
  </div>
  <div class="controlRow">
    <span>他の車</span>
    <button id="spawnTrafficButton" type="button">車を発生</button>
  </div>
</div>
<script>
// 3Dオブジェクトを配置する舞台です。
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d9ef);
scene.fog = new THREE.Fog(0xb9d9ef, 12000, 50000);
// プレイヤーが見る視点。画角や描画距離もここで決めます。
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 1, 100000);
// WebGLで3Dを画面に描く装置を用意します。
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 空と地面からの環境光、および影を作る太陽光を追加します。
const ambientLight = new THREE.HemisphereLight(0xffffff, 0x64745a, 2);
scene.add(ambientLight);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-3000, 6000, 4000);
sun.castShadow = true;
scene.add(sun);

// 道路の周囲に広がる地面です。
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100000, 100000), new THREE.MeshStandardMaterial({ color: 0x668b4e, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -300;
ground.receiveShadow = true;
scene.add(ground);

// 直線道路：前後に長く続く一本道です。
const asphalt = new THREE.MeshStandardMaterial({ color: 0x34383d, roughness: 0.95 });
const roadAlongZ = new THREE.Mesh(new THREE.BoxGeometry(5000, 26, 50000), asphalt);
roadAlongZ.position.y = -284;
roadAlongZ.receiveShadow = true;
scene.add(roadAlongZ);
const paint = new THREE.MeshStandardMaterial({ color: 0xf4f0d8, roughness: 0.8 });
// 道路の線や横断歩道を簡単に作る共通関数です。
function roadMark(w, h, d, x, y, z, material = paint) {
  const mark = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mark.position.set(x, y, z);
  scene.add(mark);
}
// 直線道路の中央に破線を引きます。交差点の標示はありません。
for (let z = -24000; z <= 24000; z += 1800) roadMark(35, 8, 900, 0, -266, z);


// 操作する車
// プレイヤーが操作する車を複数の部品で組み立てる親グループです。
const car = new THREE.Group();
scene.add(car);
car.position.set(-1100, 0, 22000);
car.scale.setScalar(1.7);
// Nマークが車の前に来るよう、車体とマークを一緒に180度回転します。
car.rotation.y = Math.PI;
// 操作車は直線道路の端からスタートし、前方に他の車が出現します。
// 車体、屋根、タイヤを作成し、親グループにまとめます。
const body = new THREE.Mesh(new THREE.BoxGeometry(900, 400, 2000), new THREE.MeshStandardMaterial({ color: 0xe74732, roughness: 0.55 }));
body.position.y = -20;
body.castShadow = true;
body.receiveShadow = true;
car.add(body);
// 前照灯と後部ランプを車体に取り付けます。前照灯はボタンで照射します。
const headlightBulbs = [];
const headlightSpots = [];
for (const x of [-300, 300]) {
  const bulb = new THREE.Mesh(new THREE.BoxGeometry(180, 100, 28), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0x000000 }));
  bulb.position.set(x, 75, 1008);
  car.add(bulb);
  headlightBulbs.push(bulb);
  const target = new THREE.Object3D();
  target.position.set(x, 40, 6500);
  car.add(target);
  const spot = new THREE.SpotLight(0xfff1c2, 0, 9000, Math.PI / 7, 0.35, 1.2);
  spot.position.set(x, 65, 990);
  spot.target = target;
  car.add(spot);
  headlightSpots.push(spot);
}
const rearLamps = [];
for (const x of [-300, 300]) {
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(180, 110, 30), new THREE.MeshStandardMaterial({ color: 0x4d0808, emissive: 0x000000 }));
  lamp.position.set(x, 75, -1008);
  car.add(lamp);
  rearLamps.push(lamp);
}
const signalLamps = { left: [], right: [] };
for (const x of [-390, 390]) {
  const side = x < 0 ? 'right' : 'left';
  for (const z of [-1005, 1005]) {
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(95, 90, 32), new THREE.MeshStandardMaterial({ color: 0x5a3200, emissive: 0x000000 }));
    lamp.position.set(x, 95, z);
    car.add(lamp);
    signalLamps[side].push(lamp);
  }
}

const roof = new THREE.Mesh(new THREE.BoxGeometry(760, 330, 1050), new THREE.MeshStandardMaterial({ color: 0x383a3d, roughness: 0.65, metalness: 0 }));
roof.position.set(0, 345, -120);
roof.castShadow = true;
car.add(roof);
// タイヤのグループを保存し、走行時に回転させます。
const wheels = [];
const tireMaterial = new THREE.MeshStandardMaterial({ color: 0x202124, roughness: 0.9 });
const hubMaterial = new THREE.MeshStandardMaterial({ color: 0xc8cbd0, metalness: 0.65, roughness: 0.3 });
for (const x of [-520, 520]) {
  for (const z of [-620, 650]) {
    const wheel = new THREE.Group();
    wheel.position.set(x, -130, z);
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(180, 180, 130, 32), tireMaterial);
        tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wheel.add(tire);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(92, 92, 136, 24), hubMaterial);
    hub.rotation.z = Math.PI / 2;
    wheel.add(hub);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// 車の前後左右が分かるよう、車体の周囲に方角マークを表示します。
// 車の周囲に方角を示すラベルを描画して取り付けます。
function addDirectionMark(label, x, z) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const context = canvas.getContext('2d');
  context.fillStyle = 'rgba(255,255,255,0.94)';
  context.beginPath();
  context.arc(128, 128, 112, 0, Math.PI * 2);
  context.fill();
  context.strokeStyle = '#17212d';
  context.lineWidth = 12;
  context.stroke();
  context.fillStyle = '#17212d';
  context.font = 'bold 150px sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(label, 128, 133);
  const texture = new THREE.CanvasTexture(canvas);
  const mark = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false }));
  mark.position.set(x, 780, z);
  mark.scale.set(240, 240, 1);
  car.add(mark);
}
addDirectionMark('N', 0, 1450);
addDirectionMark('E', -850, 0);
addDirectionMark('W', 850, 0);
addDirectionMark('S', 0, -1450);

// ボタンを押すと道路端に現れ、道路を端から端まで走る車です。
// 道路端から端まで走る車と、出現タイマー・衝突エフェクトを管理します。
const traffic = [];
const explosions = [];
// 対向交通の車をランダムな色で作り、道路上に出現させます。
function makeTrafficCar() {
  const vehicle = new THREE.Group();
  const kind = document.getElementById('trafficType').value;
  const size = Number(document.getElementById('trafficSize').value);
  const speed = Number(document.getElementById('trafficSpeed').value);
  const configs = {
    car: { width: 900, height: 400, length: 2000, wheelX: 520, wheelZ: [-620, 650], cabin: true },
    truck: { width: 1050, height: 550, length: 3000, wheelX: 600, wheelZ: [-1050, 1050], cabin: true },
    bicycle: { width: 180, height: 1500, length: 1500, wheelX: 0, wheelZ: [-520, 520], cabin: false }
  };
  const cfg = configs[kind];
  if (kind !== 'bicycle') {
    const shell = new THREE.Mesh(new THREE.BoxGeometry(cfg.width, cfg.height, cfg.length), new THREE.MeshStandardMaterial({ color: [0x2878c7, 0xf4c542, 0xeeeeee, 0x38a06c][Math.floor(Math.random() * 4)], roughness: 0.55 }));
    shell.position.y = -20;
    shell.castShadow = true;
    vehicle.add(shell);
  }
  if (cfg.cabin) {
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(cfg.width * 0.84, cfg.height * 0.82, cfg.length * 0.52), new THREE.MeshStandardMaterial({ color: 0x383a3d, roughness: 0.65 }));
    cabin.position.set(0, cfg.height * 0.82, -cfg.length * 0.06);
    vehicle.add(cabin);
    if (kind === 'truck') {
      const cargo = new THREE.Mesh(new THREE.BoxGeometry(cfg.width * 0.92, 850, cfg.length * 0.58), new THREE.MeshStandardMaterial({ color: 0xb9bdc2, roughness: 0.8 }));
      cargo.position.set(0, 600, -cfg.length * 0.18);
      cargo.castShadow = true;
      vehicle.add(cargo);
    }
  } else if (kind === 'bicycle') {
    // 自転車の細い二輪を前後に配置し、フレームと人型の乗り手を組み立てます。
    const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x202124, roughness: 0.9 });
    for (const z of cfg.wheelZ) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(340, 340, 42, 32), wheelMaterial);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(0, 40, z);
      vehicle.add(wheel);
    }
    const frameMat = new THREE.MeshStandardMaterial({ color: 0xd9382b, roughness: 0.55 });
    const addBar = (a, b, radius = 24) => {
      const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, start.distanceTo(end), 12), frameMat);
      bar.position.copy(start).add(end).multiplyScalar(0.5);
      bar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.sub(start).normalize());
      vehicle.add(bar);
    };
    addBar([0, 40, -520], [0, 520, -100]); addBar([0, 520, -100], [0, 40, 520]);
    addBar([0, 40, -520], [0, 40, 520]); addBar([0, 40, 520], [0, 520, -100]);
    addBar([0, 520, -100], [0, 650, 180], 18);
    const riderMat = new THREE.MeshStandardMaterial({ color: 0x26384a, roughness: 0.8 });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(150, 420, 180), riderMat); torso.position.set(0, 850, -20); vehicle.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(105, 16, 16), new THREE.MeshStandardMaterial({ color: 0xd8a47c })); head.position.set(0, 1160, 80); vehicle.add(head);
    addBar([0, 740, 20], [0, 520, -100], 34); addBar([0, 740, 20], [0, 650, 180], 34);
  }
  for (const z of (kind === 'bicycle' ? [] : cfg.wheelZ)) {
    for (const side of (cfg.wheelX ? [-1, 1] : [0])) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(180, 180, 130, 24), tireMaterial);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(side * cfg.wheelX, -cfg.height * 0.28, z);
      vehicle.add(wheel);
    }
  }
  vehicle.scale.setScalar(size * (kind === 'bicycle' ? 1 : 1.7));
  vehicle.userData.travelSpeed = speed;
  vehicle.userData.laneChangeRate = kind === 'truck' ? 1 : kind === 'bicycle' ? 4 : 3;
  vehicle.userData.kind = kind;
  vehicle.position.set(car.position.x < 0 ? -1000 : 600, 0, 16000);
  vehicle.rotation.y = Math.PI;
  const lightOffsets = kind === 'bicycle' ? [0] : [-cfg.width * 0.3, cfg.width * 0.3];
  for (const x of lightOffsets) {
    const lampSize = kind === 'bicycle' ? 70 : 150;
    const headlamp = new THREE.Mesh(new THREE.BoxGeometry(lampSize, 90, 28), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0xffd966, emissiveIntensity: 1.4 }));
    headlamp.position.set(x, 75, cfg.length / 2 + 8);
    vehicle.add(headlamp);
    const tailLamp = new THREE.Mesh(new THREE.BoxGeometry(lampSize, 90, 30), new THREE.MeshStandardMaterial({ color: 0xd91616, emissive: 0x7a0000, emissiveIntensity: 0.8 }));
    tailLamp.position.set(x, 75, -cfg.length / 2 - 8);
    vehicle.add(tailLamp);
    const target = new THREE.Object3D();
    target.position.set(x, 35, 6500);
    vehicle.add(target);
    const headlight = new THREE.SpotLight(0xfff0c2, 5, 8000, Math.PI / 7, 0.4, 1.2);
    headlight.position.set(x, 60, cfg.length / 2);
    headlight.target = target;
    vehicle.add(headlight);
  }
  scene.add(vehicle);
  traffic.push(vehicle);
}
document.getElementById('spawnTrafficButton').addEventListener('click', makeTrafficCar);

const trafficSize = document.getElementById('trafficSize');

const trafficSpeed = document.getElementById('trafficSpeed');

trafficSize.addEventListener('input', () => document.getElementById('trafficSizeValue').textContent = Number(trafficSize.value).toFixed(1) + '倍');

trafficSpeed.addEventListener('input', () => document.getElementById('trafficSpeedValue').textContent = trafficSpeed.value);

// 衝突位置に粒子を発生させる爆発表現を作ります。
function explodeAt(position) {
  const particles = [];
  const colors = [0xff3b16, 0xffa321, 0xffe56b, 0x555555];
  for (let i = 0; i < 32; i++) {
    const particle = new THREE.Mesh(
      new THREE.SphereGeometry(45 + Math.random() * 55, 8, 8),
      new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)], transparent: true })
    );
    particle.position.copy(position);
    scene.add(particle);
    particles.push({ mesh: particle, velocity: new THREE.Vector3((Math.random() - 0.5) * 2200, Math.random() * 1800, (Math.random() - 0.5) * 2200) });
  }
  explosions.push({ particles, age: 0 });
}

// 押されているキーを記録し、押下・解放・ウィンドウ離脱を追跡します。
const keys = Object.create(null);
window.addEventListener('keydown', (event) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) event.preventDefault();
  keys[event.key] = true;
  keys[event.code] = true;
});
window.addEventListener('keyup', (event) => { keys[event.key] = false; keys[event.code] = false; });
window.addEventListener('blur', () => { for (const key in keys) keys[key] = false; });

// 車速・車の進行向き・カメラ向き・一人称視点の状態を保持します。
let speed = 0;
let movementYaw = car.rotation.y;
let cameraYaw = 0;
let firstPersonView = false;
// UI部品を取得し、スライダーやボタンの操作をゲーム状態へ反映します。
const speedControl = document.getElementById('speedControl');
const speedValue = document.getElementById('speedValue');
speedControl.addEventListener('input', () => { speedValue.textContent = `${Number(speedControl.value).toFixed(1)}倍`; });
document.getElementById('cameraLeft').addEventListener('click', () => { cameraYaw += Math.PI / 2; });
document.getElementById('cameraRight').addEventListener('click', () => { cameraYaw -= Math.PI / 2; });
document.getElementById('cameraMode').addEventListener('click', (event) => {
  firstPersonView = !firstPersonView;
  event.currentTarget.textContent = firstPersonView ? '三人称視点' : '一人称視点';
});
// フレーム間の経過時間を測り、動きを画面更新頻度に左右されにくくします。
let beamMode = "off";
let nightMode = false;
let activeSignal = null;
let signalElapsed = 0;
const lowBeamButton = document.getElementById('lowBeamButton');
const highBeamButton = document.getElementById('highBeamButton');
const timeOfDayButton = document.getElementById('timeOfDayButton');
const leftSignalButton = document.getElementById('leftSignalButton');
const rightSignalButton = document.getElementById('rightSignalButton');
function setSignal(side) {
  activeSignal = activeSignal === side ? null : side;
  for (const [name, button] of [['left', leftSignalButton], ['right', rightSignalButton]]) {
    const isActive = activeSignal === name;
    button.classList.toggle('active', isActive);
    button.setAttribute('aria-pressed', String(isActive));
  }
}
timeOfDayButton.addEventListener('click', () => {
  nightMode = !nightMode;
  const skyColor = nightMode ? 0x081426 : 0xb9d9ef;
  scene.background.setHex(skyColor);
  scene.fog.color.setHex(skyColor);
  ambientLight.intensity = nightMode ? 0.3 : 2;
  sun.intensity = nightMode ? 0.15 : 2;
  timeOfDayButton.textContent = nightMode ? '昼にする' : '夜にする';
  timeOfDayButton.classList.toggle('active', nightMode);
  timeOfDayButton.setAttribute('aria-pressed', String(nightMode));
});
function setBeamMode(mode) {
  beamMode = beamMode === mode ? 'off' : mode;
  const lowOn = beamMode === 'low';
  const highOn = beamMode === 'high';
  lowBeamButton.textContent = lowOn ? 'ロービーム ON' : 'ロービーム OFF';
  highBeamButton.textContent = highOn ? 'ハイビーム ON' : 'ハイビーム OFF';
  lowBeamButton.classList.toggle('active', lowOn);
  highBeamButton.classList.toggle('active', highOn);
  lowBeamButton.setAttribute('aria-pressed', String(lowOn));
  highBeamButton.setAttribute('aria-pressed', String(highOn));
  for (const bulb of headlightBulbs) bulb.material.emissive.setHex(beamMode === 'off' ? 0x000000 : 0xffe48a);
  for (const spot of headlightSpots) {
    spot.intensity = lowOn ? 3 : highOn ? 8 : 0;
    spot.distance = lowOn ? 3500 : highOn ? 9000 : 0;
  }
}
lowBeamButton.addEventListener('click', () => setBeamMode('low'));
highBeamButton.addEventListener('click', () => setBeamMode('high'));
leftSignalButton.addEventListener('click', () => setSignal('left'));
rightSignalButton.addEventListener('click', () => setSignal('right'));

const clock = new THREE.Clock();
// 2台の車の向きを考慮し、矩形の車体が接触しているか判定します。
function carsOverlap(a, b) {
  const axes = [];
  for (const vehicle of [a, b]) {
    const yaw = vehicle.rotation.y;
    axes.push({ x: Math.cos(yaw), z: -Math.sin(yaw) });
    axes.push({ x: Math.sin(yaw), z: Math.cos(yaw) });
  }
  const dimensions = (vehicle) => {
    const kind = vehicle.userData.kind || 'player';
    const width = kind === 'truck' ? 525 : kind === 'bicycle' ? 100 : 450;
    const length = kind === 'truck' ? 1500 : kind === 'bicycle' ? 750 : 1000;
    return { width: width * vehicle.scale.x, length: length * vehicle.scale.z };
  };
  const sizeA = dimensions(a);
  const sizeB = dimensions(b);
  const dx = b.position.x - a.position.x;
  const dz = b.position.z - a.position.z;
  for (const axis of axes) {
    const distance = Math.abs(dx * axis.x + dz * axis.z);
    const projection = (vehicle, size) => Math.abs(Math.cos(vehicle.rotation.y) * axis.x - Math.sin(vehicle.rotation.y) * axis.z) * size.width
      + Math.abs(Math.sin(vehicle.rotation.y) * axis.x + Math.cos(vehicle.rotation.y) * axis.z) * size.length;
    if (distance > projection(a, sizeA) + projection(b, sizeB)) return false;
  }
  return true;
}// 毎フレーム呼び出され、交通・衝突・操作・カメラを更新して描画します。
function draw() {
  requestAnimationFrame(draw);
    const dt = Math.min(clock.getDelta(), 0.05);
    for (let i = traffic.length - 1; i >= 0; i--) {
    const vehicle = traffic[i];
    // 操作車の左右車線に合わせて、対向車も滑らかに車線を移ります。
    const targetLaneX = car.position.x < 0 ? -1000 : 600;
    vehicle.position.x += (targetLaneX - vehicle.position.x) * Math.min(1, dt * vehicle.userData.laneChangeRate);
    vehicle.position.z -= vehicle.userData.travelSpeed * dt;
    if (carsOverlap(car, vehicle)) {
      explodeAt(new THREE.Vector3((vehicle.position.x + car.position.x) / 2, 180, (vehicle.position.z + car.position.z) / 2));
      scene.remove(vehicle);
      traffic.splice(i, 1);
      speed *= 0.25;
    } else if (vehicle.position.z < -26000) { scene.remove(vehicle); traffic.splice(i, 1); }
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    const effect = explosions[i];
    effect.age += dt;
    for (const particle of effect.particles) {
      particle.mesh.position.addScaledVector(particle.velocity, dt);
      particle.velocity.y -= 900 * dt;
      particle.mesh.material.opacity = Math.max(0, 1 - effect.age / 1.1);
    }
    if (effect.age >= 1.1) {
      for (const particle of effect.particles) { scene.remove(particle.mesh); particle.mesh.geometry.dispose(); particle.mesh.material.dispose(); }
      explosions.splice(i, 1);
    }
  }

  // Qキーを押している間は前後進を問わず、↓キーで前進を減速する間もブレーキランプを点灯します。
  const braking = keys.KeyQ || (keys.ArrowDown && speed > 0);
  for (const lamp of rearLamps) {
    lamp.material.emissive.setHex(braking ? 0xff0000 : 0x000000);
    lamp.material.color.setHex(braking ? 0xff2525 : 0x4d0808);
  }
  signalElapsed += dt;
  const signalLit = activeSignal !== null && Math.floor(signalElapsed / 0.45) % 2 === 0;
  for (const [side, lamps] of Object.entries(signalLamps)) {
    for (const lamp of lamps) {
      const on = side === activeSignal && signalLit;
      lamp.material.emissive.setHex(on ? 0xff9d00 : 0x000000);
      lamp.material.color.setHex(on ? 0xffb21c : 0x5a3200);
    }
  }
  // ↑キーでNマーク方向へ前進し、↓キーで減速して停止後は後退します。
  const speedMultiplier = Number(speedControl.value);
  const maxSpeed = 2600 * speedMultiplier;
  if (keys.ArrowUp && !keys.KeyQ) speed = Math.min(speed + 900 * speedMultiplier * dt, maxSpeed);
  else if (keys.KeyQ) speed = Math.abs(speed) < 1100 * speedMultiplier * dt ? 0 : speed - Math.sign(speed) * 1100 * speedMultiplier * dt;
  else if (keys.ArrowDown) speed = Math.max(speed - 1100 * speedMultiplier * dt, -1000 * speedMultiplier);
  else speed *= Math.pow(0.985, dt * 60);
  const steering = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  if (steering !== 0) {
    const turnAmount = steering * 0.9 * dt * (Math.abs(speed) > 5 ? Math.sign(speed) : 1);
    movementYaw += turnAmount;
    car.rotation.y += turnAmount;
  }
  if (Math.abs(speed) > 5) {


        car.position.x += Math.sin(movementYaw) * speed * dt;
    car.position.z += Math.cos(movementYaw) * speed * dt;
    for (const wheel of wheels) wheel.rotation.x += speed * dt / 180;
  }

  // カメラの向きは車のハンドル操作から独立。ボタンで90度ずつ切り替えます。
  if (firstPersonView) {
    const cameraPosition = car.localToWorld(new THREE.Vector3(-180, 590, 430));
    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
    camera.position.copy(cameraPosition);
    camera.lookAt(cameraPosition.clone().addScaledVector(forward, 5000));
  } else {
    const cameraBehind = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
    const target = car.position.clone().add(new THREE.Vector3(0, 180, 0));
    const cameraPosition = car.position.clone().addScaledVector(cameraBehind, 3200);
    cameraPosition.y += 1900;
    camera.position.lerp(cameraPosition, 1 - Math.pow(0.001, dt));
    camera.lookAt(target);
  }
  renderer.render(scene, camera);
}
draw();

// ウィンドウサイズ変更時にカメラと描画領域の比率を更新します。
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
